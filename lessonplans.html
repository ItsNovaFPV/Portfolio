<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Lesson Plans | Aaron Battle</title>
	<link rel="icon" href="./favicon.ico" sizes="any" />
	<link rel="icon" type="image/png" sizes="32x32" href="./favicon-32x32.png" />
	<link rel="icon" type="image/png" sizes="16x16" href="./favicon-16x16.png" />
	<link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
	<link rel="manifest" href="./site.webmanifest" />
	<link rel="preconnect" href="https://fonts.googleapis.com" />
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700;800&display=swap" rel="stylesheet" />
	<style>
		:root {
			color-scheme: dark;
			--bg: #06070b;
			--text-main: #f3f5ff;
			--text-muted: #9aa4c2;
			--accent: #7b8cff;
		}

		* {
			box-sizing: border-box;
			margin: 0;
			padding: 0;
		}

		html {
			scroll-behavior: smooth;
		}

		body {
			min-height: 100vh;
			font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
			background: radial-gradient(circle at 20% 10%, #10172a 0%, var(--bg) 52%);
			color: var(--text-main);
			overflow-x: hidden;
		}

		#particles-js {
			position: fixed;
			inset: 0;
			z-index: -1;
			pointer-events: none;
		}

		header.topbar {
			position: fixed;
			top: 0;
			left: 0;
			right: 0;
			z-index: 10;
			padding: 1.35rem 2rem;
			backdrop-filter: blur(6px);
		}

		.topbar-inner {
			display: flex;
			align-items: center;
			justify-content: center;
			gap: 3.6rem;
		}

		.name {
			font-size: clamp(1.1rem, 3.5vw, 1.9rem);
			font-weight: 800;
			letter-spacing: -0.02em;
			text-align: center;
			white-space: nowrap;
			order: 1;
		}

		.menu {
			display: flex;
			gap: 1.2rem;
			align-items: center;
		}

		.menu-left {
			order: 0;
		}

		.menu-right {
			order: 2;
			flex-wrap: wrap;
		}

		.nav-link {
			text-decoration: none;
			color: var(--text-main);
			font-weight: 500;
			font-size: 0.95rem;
			letter-spacing: 0.01em;
			position: relative;
			padding-bottom: 0.15rem;
			transition: color 160ms ease;
			white-space: nowrap;
			min-width: 140px;
			text-align: center;
			cursor: pointer;
		}

		.nav-link::after {
			content: "";
			position: absolute;
			left: 0;
			bottom: -0.2rem;
			width: 100%;
			height: 1.5px;
			background: linear-gradient(90deg, var(--accent), rgba(123, 140, 255, 0));
			transform: scaleX(0);
			transform-origin: left;
			transition: transform 170ms ease;
		}

		.nav-link:hover,
		.nav-link:focus-visible {
			color: #dce2ff;
			outline: none;
		}

		.nav-link:hover::after,
		.nav-link:focus-visible::after {
			transform: scaleX(1);
		}

		main {
			position: relative;
			z-index: 0;
			max-width: 1180px;
			margin: 0 auto;
			padding: 9.5rem 2rem 4.5rem;
		}

		.hero {
			text-align: center;
			max-width: 900px;
			margin: 0 auto 2rem;
		}

		.hero h1 {
			font-size: clamp(2.3rem, 6.5vw, 4.4rem);
			line-height: 1.05;
			letter-spacing: -0.03em;
			font-weight: 800;
			margin-bottom: 1rem;
			background: linear-gradient(135deg, #dce2ff, var(--accent));
			-webkit-background-clip: text;
			-webkit-text-fill-color: transparent;
			background-clip: text;
		}

		.hero p {
			font-size: clamp(1rem, 2.2vw, 1.18rem);
			line-height: 1.85;
			color: var(--text-muted);
			max-width: 78ch;
			margin: 0 auto;
		}

		.panel {
			background: rgba(14, 16, 24, 0.52);
			border: 1px solid rgba(255, 255, 255, 0.12);
			border-radius: 22px;
			padding: 2rem;
			backdrop-filter: blur(8px);
		}

		.panel h2 {
			font-size: clamp(1.5rem, 3.5vw, 2.2rem);
			margin-bottom: 1rem;
			color: #dce2ff;
		}

		.pdf-viewer {
			position: relative;
			border-radius: 18px;
			overflow: hidden;
			border: 1px solid rgba(255, 255, 255, 0.12);
			background: rgba(10, 12, 18, 0.92);
			min-height: 860px;
		}

		.pdf-viewer object,
		.pdf-viewer iframe {
			width: 100%;
			height: 100%;
			min-height: 860px;
			border: 0;
			display: block;
		}

		.pdf-fallback {
			padding: 2rem;
			color: var(--text-muted);
			line-height: 1.75;
		}

		.action-row {
			display: flex;
			gap: 1rem;
			flex-wrap: wrap;
		}

		.action-link {
			display: inline-flex;
			align-items: center;
			justify-content: center;
			padding: 0.95rem 1.2rem;
			border-radius: 999px;
			text-decoration: none;
			color: #e8edff;
			background: rgba(123, 140, 255, 0.25);
			border: 1px solid rgba(123, 140, 255, 0.38);
			transition: transform 160ms ease, background 160ms ease, border-color 160ms ease;
		}

		.action-link:hover,
		.action-link:focus-visible {
			transform: translateY(-2px);
			background: rgba(123, 140, 255, 0.38);
			border-color: rgba(123, 140, 255, 0.58);
			outline: none;
		}

		footer {
			position: relative;
			z-index: 5;
			padding: 2rem 2rem 1.5rem;
			background: rgba(6, 7, 11, 0.95);
			border-top: 1px solid rgba(255, 255, 255, 0.08);
			backdrop-filter: blur(8px);
		}

		.footer-content {
			max-width: 1200px;
			margin: 0 auto;
			text-align: center;
		}

		.footer-credit {
			font-size: 0.8rem;
			color: rgba(154, 164, 194, 0.4);
			letter-spacing: 0.02em;
			margin: 0;
		}

		@media (max-width: 1000px) {
			.pdf-viewer,
			.pdf-viewer object,
			.pdf-viewer iframe {
				min-height: 700px;
			}
		}

		@media (max-width: 900px) {
			header.topbar {
				padding: 1rem 1rem 1.2rem;
			}

			.topbar-inner {
				flex-direction: column;
				gap: 0.6rem;
			}

			.menu-left,
			.menu-right {
				justify-content: center;
				flex-wrap: wrap;
				gap: 0.9rem;
			}

			.name {
				order: 0;
			}

			.menu-left {
				order: 1;
			}

			.menu-right {
				order: 2;
			}

			.nav-link {
				min-width: 110px;
			}

			main {
				padding: 8.9rem 1rem 4rem;
			}

			.lesson-points li {
				padding: 1.5rem;
			}

			.pdf-viewer,
			.pdf-viewer object,
			.pdf-viewer iframe {
				min-height: 560px;
			}
		}
	</style>
</head>
<body>
	<div id="particles-js" aria-hidden="true"></div>

	<header class="topbar" aria-label="Primary site navigation">
		<div class="topbar-inner">
			<nav class="menu menu-left" aria-label="Primary portfolio links left">
				<a class="nav-link" href="./index.html#about">About Me</a>
				<a class="nav-link" href="./teachingphilosophy.html">Teaching Philosophy</a>
			</nav>

			<a href="./index.html#hero" style="text-decoration: none; color: inherit;">
				<h1 class="name">Aaron Battle</h1>
			</a>

			<nav class="menu menu-right" aria-label="Primary portfolio links right">
				<a class="nav-link" href="./teachingexperience.html">Teaching Experience</a>
				<a class="nav-link" href="./lessonplans.html">Lesson Plans</a>
				<a class="nav-link" href="./index.html#contact">Contact</a>
			</nav>
		</div>
	</header>

	<main>
		<section class="hero">
			<h1>Lesson Plans</h1>
		</section>

		<section class="panel" aria-label="Lesson plans document">
			<h2>PDF Preview</h2>
			<div class="action-row" style="margin-bottom: 1.2rem;">
				<a class="action-link" href="./media/Pottersville,%20MI%20Lesson%20Plan.pdf" target="_blank" rel="noopener">Open PDF</a>
				<a class="action-link" href="./media/Pottersville,%20MI%20Lesson%20Plan.pdf" download>Download PDF</a>
			</div>
			<div class="pdf-viewer">
				<iframe
					src="./media/Pottersville,%20MI%20Lesson%20Plan.pdf"
					title="Lesson Plans PDF"
					loading="eager"
					referrerpolicy="no-referrer"></iframe>
			</div>
		</section>
	</main>

	<script src="https://cdn.jsdelivr.net/npm/tsparticles@2/tsparticles.bundle.min.js"></script>
	<script>
		tsParticles.load("particles-js", {
			fpsLimit: 60,
			particles: {
				number: { value: 60, density: { enable: true, area: 850 } },
				color: { value: ["#9aa5ff", "#63ddff", "#c7d0ff"] },
				links: {
					enable: true,
					distance: 140,
					color: "#8f9dff",
					opacity: 0.2,
					width: 1
				},
				move: {
					enable: true,
					speed: 0.8,
					outModes: { default: "out" }
				},
				opacity: { value: { min: 0.16, max: 0.5 } },
				size: { value: { min: 1, max: 2.6 } }
			},
			interactivity: {
				events: {
					onHover: { enable: true, mode: "repulse" },
					resize: true
				},
				modes: {
					repulse: { distance: 88, duration: 0.35 }
				}
			},
			detectRetina: true,
			background: { color: "transparent" }
		});
	</script>

	<footer>
		<div class="footer-content">
			<p class="footer-credit">Website Designed and Engineered by Aaron Battle</p>
			<p class="footer-credit">Contact: battle.aaron.m@gmail.com</p>
		</div>
	</footer>
</body>
</html>
